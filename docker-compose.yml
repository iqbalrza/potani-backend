# Stack lokal: PostgreSQL + broker MQTT (tanpa TLS) + 3 proses Potani.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: potani
      POSTGRES_PASSWORD: potani
      POSTGRES_DB: potani
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U potani"]
      interval: 3s
      retries: 20

  mqtt:
    image: eclipse-mosquitto:2
    command: mosquitto -c /mosquitto-no-auth.conf
    ports: ["1883:1883"]

  api:
    build: .
    env_file: .env
    environment: &local
      DATABASE_URL: postgresql+psycopg://potani:potani@db:5432/potani
      MQTT_HOST: mqtt
      MQTT_PORT: "1883"
      MQTT_TLS: "false"
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}

  mqtt_worker:
    build: .
    env_file: .env
    environment: *local
    command: python -m app.workers.mqtt_worker
    depends_on: [api, mqtt]
    restart: unless-stopped

  scheduler_worker:
    build: .
    env_file: .env
    environment: *local
    command: python -m app.workers.scheduler_worker
    depends_on: [api]
    restart: unless-stopped
